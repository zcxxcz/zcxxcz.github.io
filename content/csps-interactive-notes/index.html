<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>CSP-S 算法互动笔记：从数据范围到算法</title>
<style>
:root{
  --paper:#f2f5f8;--panel:#ffffff;--ink:#14263b;--mute:#58697b;--line:#cfd9e3;
  --blue:#1f5fbf;--blue-soft:#e3edfb;--onblue:#ffffff;
  --ok:#1b7a4d;--ok-soft:#dff3e8;--bad:#b83232;--bad-soft:#fbe6e6;
  --warn:#8a5a00;--warn-soft:#fff0cc;--demo:#6b3fa0;--demo-soft:#efe6fa;--grid:rgba(31,95,191,.07);
  --sans:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --serif:"Songti SC","Noto Serif CJK SC","Source Han Serif SC","STSong","SimSun",serif;
  --mono:ui-monospace,"SF Mono",Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#0e1a28;--panel:#142437;--ink:#e6eef7;--mute:#9db0c4;--line:#2b4058;
  --blue:#6aa5ff;--blue-soft:#17315a;--onblue:#0e1a28;
  --ok:#5fd39a;--ok-soft:#12372a;--bad:#ff8a8a;--bad-soft:#3d1c1f;
  --warn:#f2c35b;--warn-soft:#3a2f12;--demo:#c7a5ff;--demo-soft:#2d2145;--grid:rgba(106,165,255,.08);}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);background:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;font:16px/1.7 var(--sans);-webkit-text-size-adjust:100%}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
nav{position:sticky;top:0;align-self:start;height:100vh;overflow:auto;padding:20px 12px;border-right:1px solid var(--line);background:var(--panel)}
nav .brand{font-family:var(--serif);font-weight:700;font-size:17px;line-height:1.4;margin:0 8px 14px}
nav a{display:block;padding:8px 10px;border-radius:3px;color:var(--ink);text-decoration:none;font-size:15px;border-left:3px solid transparent}
nav a:hover{background:var(--blue-soft)}
nav a[aria-current=page]{background:var(--blue-soft);border-left-color:var(--blue);font-weight:600}
main{padding:28px clamp(14px,4vw,44px) 90px;max-width:1000px;min-width:0}
@media (max-width:820px){
  .app{display:block}
  nav{position:sticky;top:0;z-index:5;height:auto;display:flex;overflow-x:auto;gap:2px;padding:6px 8px;border-right:0;border-bottom:1px solid var(--line)}
  nav .brand{display:none}
  nav a{white-space:nowrap;border-left:0;border-bottom:3px solid transparent;padding:8px 10px}
  nav a[aria-current=page]{border-bottom-color:var(--blue)}
  main{padding:18px 14px 90px}
}
h1,h2,h3{font-family:var(--serif);line-height:1.35;margin:0}
h1{font-size:clamp(26px,5vw,36px);margin-bottom:10px}
h2{font-size:22px;margin:30px 0 10px;padding-top:6px}
h3{font-size:17px;margin:18px 0 6px}
p{margin:8px 0;max-width:44em}
.lead{font-size:17px;color:var(--mute);max-width:42em}
a{color:var(--blue)}
code,.mono{font-family:var(--mono);font-size:.93em}
pre{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:10px 12px;overflow-x:auto;font:13.5px/1.55 var(--mono);margin:8px 0}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
th{background:var(--blue-soft)}
.scroll{overflow-x:auto}
.doc{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:18px clamp(12px,3vw,24px);margin:14px 0}
.ctls{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px 24px;margin:12px 0}
.ctl{display:block}
.cl{display:block;font-size:14px;color:var(--mute);margin-bottom:2px}
.cl output{color:var(--ink);font-family:var(--mono);font-weight:700;margin:0 4px}
input[type=range]{width:100%;accent-color:var(--blue);min-height:28px}
select,input[type=text],input[type=number]{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:3px;background:var(--panel);color:var(--ink);width:100%;min-height:38px}
.btn{font:inherit;padding:7px 13px;border:1px solid var(--blue);background:var(--panel);color:var(--blue);border-radius:3px;cursor:pointer;min-height:38px}
.btn:hover{background:var(--blue-soft)}
.btn.pri{background:var(--blue);color:var(--onblue)}
.btn:disabled{opacity:.4;cursor:default}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.seg{display:flex;flex-wrap:wrap;gap:6px 14px;margin:6px 0}
.seg label{display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{font:inherit;font-size:14px;padding:4px 10px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);cursor:pointer}
.chip[aria-pressed=true]{background:var(--blue);color:var(--onblue);border-color:var(--blue)}
.n{display:flex;gap:10px;margin:12px 0;padding:9px 12px;border-left:4px solid var(--c);background:var(--cs);border-radius:0 3px 3px 0;max-width:52em}
.n>b{flex:none;color:var(--c)}
.n>div{min-width:0}
.n-hard{--c:var(--bad);--cs:var(--bad-soft)}
.n-why{--c:var(--blue);--cs:var(--blue-soft)}
.n-asm{--c:var(--warn);--cs:var(--warn-soft)}
.n-lim{--c:var(--warn);--cs:var(--warn-soft)}
.n-tip{--c:var(--ok);--cs:var(--ok-soft)}
.tag{display:inline-block;font-size:12px;line-height:1.5;padding:0 8px;border-radius:10px;border:1px solid currentColor;vertical-align:middle;margin-left:4px;white-space:nowrap}
.tag.demo{color:var(--demo);background:var(--demo-soft)}
.tag.calc{color:var(--ok);background:var(--ok-soft)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warnc{color:var(--warn)}.mute{color:var(--mute)}
.kpi{display:flex;flex-wrap:wrap;gap:10px 28px;margin:10px 0}
.kpi div span{display:block;font-size:13px;color:var(--mute)}
.kpi div b{font-size:19px;font-family:var(--mono)}
.track{position:relative;height:14px;background:var(--line);border-radius:2px}
.fill{height:100%;border-radius:2px;min-width:2px}
.fill.ok{background:var(--ok)}.fill.bad{background:var(--bad)}.fill.edge{background:var(--warn)}
.line{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.brow{display:grid;grid-template-columns:minmax(110px,190px) 1fr 110px;gap:4px 10px;align-items:center;margin:8px 0;font-size:14.5px}
.brow .bv{font-family:var(--mono);text-align:right}
@media (max-width:560px){.brow{grid-template-columns:1fr}.brow .bv{text-align:left}}
.cxr{display:grid;grid-template-columns:104px 1fr;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.cxr .nm{font-family:var(--mono);font-weight:700}
.cxr .meta{grid-column:1/-1;font-size:13.5px;color:var(--mute)}
.cxr .vd{grid-column:1/-1;font-size:14.5px}
.stepbar{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 6px}
.stview{margin:12px 0;overflow-x:auto;padding:4px 0}
.sttext{border:1px dashed var(--line);padding:10px 12px;border-radius:3px;min-height:3.4em;background:var(--panel);max-width:52em}
.cell{display:inline-flex;flex-direction:column;min-width:34px;height:36px;padding:0 4px;align-items:center;justify-content:center;border:1px solid var(--line);margin:2px;font-family:var(--mono);background:var(--panel);border-radius:2px;position:relative;font-size:14px}
.cell small{font-size:10px;color:var(--mute);line-height:1}
.cell.in{background:var(--blue-soft);border-color:var(--blue)}
.cell.mid{background:var(--blue);color:var(--onblue);border-color:var(--blue)}
.cell.mid small{color:var(--onblue)}
.cell.out{opacity:.35}
.cell.ans{box-shadow:0 0 0 2px var(--ok)}
.cell.chg{background:var(--warn-soft);border-color:var(--warn);font-weight:700}
.cell.prime{background:var(--blue);color:var(--onblue);border-color:var(--blue)}
.cell.comp{opacity:.4;text-decoration:line-through}
.cell.cur{box-shadow:0 0 0 2px var(--warn);opacity:1}
.cell.fin{background:var(--ok-soft);border-color:var(--ok)}
.cell.hl{box-shadow:0 0 0 2px var(--blue)}
.cell.win{background:var(--ok-soft);border-color:var(--ok)}
.cell.lose{background:var(--bad-soft);border-color:var(--bad)}
.vars{display:flex;flex-wrap:wrap;gap:6px 18px;font-family:var(--mono);margin:6px 0}
.grid8{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:2px;max-width:420px}
.gc{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--panel);font-family:var(--mono);font-size:13px;cursor:pointer;position:relative}
.gc.wall{background:var(--ink);color:var(--paper)}
.gc.vis{background:var(--blue-soft)}
.gc.inq{border:2px dashed var(--blue)}
.gc.nw{background:var(--warn-soft)}
.gc.cur{box-shadow:inset 0 0 0 3px var(--warn)}
.gc.path{background:var(--ok-soft);box-shadow:inset 0 0 0 2px var(--ok)}
.gc.se{font-weight:700;color:var(--bad)}
.bit{font:inherit;width:36px;height:46px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;margin:2px;border-radius:3px;font-family:var(--mono);font-size:18px;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;padding:0}
.bit small{font-size:10px;color:var(--mute)}
.bit.one{background:var(--blue);color:var(--onblue);border-color:var(--blue)}
.bit.one small{color:var(--onblue)}
.bit.sign{box-shadow:0 0 0 2px var(--bad)}
.gap{display:inline-block;width:8px}
svg.tree{max-width:100%;height:auto;background:var(--panel);border:1px solid var(--line);border-radius:3px}
svg.tree line{stroke:var(--mute);stroke-width:1.5}
svg.tree circle{fill:var(--panel);stroke:var(--mute);stroke-width:1.5}
svg.tree circle.vis{fill:var(--blue-soft);stroke:var(--blue)}
svg.tree circle.now{fill:var(--blue);stroke:var(--blue)}
svg.tree text{fill:var(--ink);font:600 15px var(--mono);text-anchor:middle;dominant-baseline:central}
svg.tree text.now{fill:var(--onblue)}
svg.tree text.ord{font:11px var(--mono);fill:var(--mute)}
.pipe{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;margin:12px 0}
.pipe div{flex:1 1 170px;border:1px solid var(--line);background:var(--panel);padding:9px 11px;border-radius:3px;font-size:14.5px}
.pipe b{display:block;font-family:var(--serif);font-size:16px}
.ent{border-top:1px solid var(--line)}
.ent summary{cursor:pointer;padding:9px 2px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.ent .lv{font-size:12px;color:var(--demo);border:1px solid currentColor;border-radius:10px;padding:0 7px}
.ent .bd{padding:2px 4px 12px 14px;font-size:15px}
.err{color:var(--bad);font-weight:600}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.chk{display:flex;gap:8px;align-items:flex-start;margin:6px 0}
.chk input{margin-top:6px;width:18px;height:18px;flex:none}
details.fold{margin:10px 0}
details.fold summary{cursor:pointer;color:var(--blue)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="app">
  <nav id="nav" aria-label="章节导航"></nav>
  <main id="main"></main>
</div>
<script>
'use strict';
/* ====== 基础工具 ====== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n).toLocaleString('en-US');
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const gcd=(a,b)=>b?gcd(b,a%b):a;
const lcm=(a,b)=>a/gcd(a,b)*b;
function prng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
let SEED=20261006, timers=[];
function stopTimers(){timers.forEach(clearInterval);timers=[];}
function sci(l){if(!isFinite(l))return'∞';if(l<6)return fmt(Math.round(Math.pow(10,l)));if(l>=1e4)return'10^'+fmt(Math.round(l));const e=Math.floor(l),m=Math.pow(10,l-e);return'≈ '+m.toFixed(1)+'×10^'+e;}
const NOTE={hard:'难点',why:'为什么',asm:'假设',lim:'适用边界',tip:'提示'};
const note=(k,t)=>`<aside class="n n-${k}"><b>${NOTE[k]}</b><div>${t}</div></aside>`;
const TAG_DEMO='<span class="tag demo">示意数据</span>',TAG_CALC='<span class="tag calc">实时计算</span>';
const rng=(id,label,min,max,step,val,unit='')=>`<label class="ctl"><span class="cl">${label}<output id="${id}-o">${val}</output>${unit}</span><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}"></label>`;
const cell=(t,c='',sub='')=>`<span class="cell ${c}">${t}${sub!==''?`<small>${sub}</small>`:''}</span>`;
const parseInts=(s)=>s.split(/[,，\s]+/).filter(Boolean).map(Number);
document.addEventListener('input',e=>{const t=e.target;if(t&&t.type==='range'&&t.id){const o=document.getElementById(t.id+'-o');if(o)o.textContent=t.value;}});
function head(title,lead){return `<header><h1>${title}</h1><p class="lead">${lead}</p></header>`;}

/* ====== 路由 ====== */
const SECTIONS=[
 {id:'home',t:'总览与使用说明',f:mod_home},
 {id:'cx',t:'① 数据范围 → 复杂度',f:mod_cx},
 {id:'cmp',t:'② 暴力 vs 优化',f:mod_cmp},
 {id:'st',t:'③ 算法逐步演示',f:mod_steps},
 {id:'bit',t:'④ 进制、补码与 ASCII',f:mod_bit},
 {id:'pit',t:'⑤ 细节陷阱与对拍',f:mod_pit},
 {id:'tree',t:'⑥ 二叉树与表达式',f:mod_tree},
 {id:'mat',t:'⑦ 计数与博弈',f:mod_mat},
 {id:'ref',t:'⑧ 知识点手册（全览）',f:mod_ref},
 {id:'road',t:'⑨ 学习路线与检查表',f:mod_road}
];
function buildNav(){$('#nav').innerHTML='<div class="brand">CSP-S 算法<br>互动笔记</div>'+SECTIONS.map(s=>`<a href="#${s.id}" data-id="${s.id}">${s.t}</a>`).join('');}
function go(){
  const id=(location.hash||'#home').slice(1);
  const s=SECTIONS.find(x=>x.id===id)||SECTIONS[0];
  stopTimers();
  const m=$('#main');m.innerHTML='';
  const root=document.createElement('div');m.appendChild(root);
  s.f(root);
  $$('#nav a').forEach(a=>{if(a.dataset.id===s.id)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
  const cur=$('#nav a[aria-current]');if(cur&&cur.scrollIntoView)cur.scrollIntoView({block:'nearest',inline:'center'});
  window.scrollTo(0,0);
}

/* ====== 总览 ====== */
function mod_home(r){
 r.innerHTML=head('把数据范围读成算法线索','这是为 CSP-S 备考的家长准备的互动笔记。每个页面都按「难点 → 操作 → 结果 → 原因 → 假设与边界」组织：拖动滑块、切换步骤，直接看到数字怎么变，以及为什么变。')+`
 <div class="pipe" aria-label="解题主线">
  <div><b>读数据范围</b>n、m、q、值域、组数 T</div>
  <div><b>反推复杂度</b>按时限估出能做的运算次数 → <a href="#cx">页面①</a></div>
  <div><b>缩小候选算法</b>同一复杂度对应多种算法</div>
  <div><b>看题目结构选定</b>区间？树？图？序列？</div>
 </div>
 <h2>先确定难点，再选交互方式</h2>
 <p>下面是我认为最容易卡住的 8 个理解难点，以及各自配的交互方式：</p>
 <div class="scroll"><table>
 <tr><th>难点</th><th>交互方式</th><th>在哪</th></tr>
 <tr><td>数据范围到底限制了什么复杂度</td><td>滑块 + 「预算线」对比条</td><td><a href="#cx">页面①</a></td></tr>
 <tr><td>暴力慢在哪，优化到底省了多少、何时不划算</td><td>对比视图（真实计数两种做法的运算次数）</td><td><a href="#cmp">页面②</a></td></tr>
 <tr><td>算法每一步在干什么（二分答案、背包、单调队列、快速幂、筛法、排序、BFS）</td><td>步骤切换 + 自动播放 + 可改参数</td><td><a href="#st">页面③</a></td></tr>
 <tr><td>计算机怎么存整数；补码、溢出</td><td>可点击的二进制位开关</td><td><a href="#bit">页面④</a></td></tr>
 <tr><td>「思路对却丢分」：溢出、精度、取模、内存、测试数据设计</td><td>参数试验 + 迷你对拍实验</td><td><a href="#pit">页面⑤</a></td></tr>
 <tr><td>树的三种遍历与还原；表达式与后缀式</td><td>输入序列 → 画树 → 逐步高亮</td><td><a href="#tree">页面⑥</a></td></tr>
 <tr><td>容斥、插板、博弈结论为什么成立</td><td>勾选/滑块 + 逐项展开 + 暴力验证</td><td><a href="#mat">页面⑦</a></td></tr>
 <tr><td>知识点太多，不知道属于哪一类</td><td>可搜索、可筛选的手册（约 100 条）</td><td><a href="#ref">页面⑧</a></td></tr>
 </table></div>
 <h2>三块内容怎么对应之前的总结</h2>
 <div class="scroll"><table>
 <tr><th>块</th><th>内容</th><th>主要页面</th></tr>
 <tr><td>效率层</td><td>DP、前缀和、线段树、最短路、二分、哈希、KMP……（把复杂度压下来）</td><td>①②③⑧</td></tr>
 <tr><td>工具层</td><td>语法、模拟、枚举、建模、数学基础、构造、细节</td><td>⑤⑦⑧</td></tr>
 <tr><td>补充块</td><td>计算机基础、排序、树与堆、图补充、组合、博弈、几何、进阶结构、考试工程</td><td>③④⑥⑦⑧</td></tr>
 </table></div>
 ${note('asm','本页的全局假设：①「约 10⁸ 次简单运算/秒」只是估算口径，真实速度受语言、常数、缓存、评测机影响；②时间、内存限制一律以题面为准；③「效率层/工具层」是我为帮助理解划的框架，不是 CCF 官方分类；具体考点请对照官方最新大纲与当年通知；④标有'+TAG_DEMO+'的数据是随机生成或手工编的例子，'+TAG_CALC+'表示由你设置的参数现场算出。')}
 <h2>使用说明（简版）</h2>
 <ol>
  <li>用左侧（手机为顶部）导航切换页面，建议先看①②，再按需看③–⑦。</li>
  <li>滑块、下拉框、输入框改动后立即更新结果；每页的「为什么」框解释变化原因，「适用边界」框说明什么时候这个结论不成立。</li>
  <li>页面③有「上一步 / 下一步 / 自动播放 / 跳到结尾」；迷宫可以点格子放置或拆除墙。</li>
  <li>「换一组示意数据」会重新生成随机数据，便于观察结论是否稳定。</li>
  <li>本文件完全离线可用，不需要网络；页面⑨的学习进度勾选会保存在本浏览器里（若浏览器禁用存储则不保存）。</li>
 </ol>`;
}

/* ====== ① 复杂度 ====== */
function lfact(n){if(n<=20){let s=0;for(let i=2;i<=n;i++)s+=Math.log10(i);return s;}return(n*Math.log(n)-n+0.5*Math.log(2*Math.PI*n))/Math.LN10;}
const CX=[
 {n:'O(log n)',lg:n=>Math.log10(Math.max(1,Math.log2(n))),al:'二分、快速幂、倍增、公式推导'},
 {n:'O(n)',lg:n=>Math.log10(n),al:'线性扫描、前缀和/差分、双指针、单调栈/队列、桶、线性筛、KMP'},
 {n:'O(n log n)',lg:n=>Math.log10(n*Math.max(1,Math.log2(n))),al:'排序、堆、树状数组、线段树、离散化、归并、Dijkstra 堆优化'},
 {n:'O(n√n)',lg:n=>1.5*Math.log10(n),al:'分块、莫队'},
 {n:'O(n²)',lg:n=>2*Math.log10(n),al:'二维 DP、朴素最短路、枚举点对、O(n²) 排序'},
 {n:'O(n³)',lg:n=>3*Math.log10(n),al:'区间 DP、Floyd'},
 {n:'O(2ⁿ)',lg:n=>n*Math.log10(2),al:'子集枚举、状压 DP（常带 n² 因子）、搜索加剪枝、折半搜索（降为 2^(n/2)）'},
 {n:'O(n!)',lg:n=>lfact(n),al:'全排列枚举（n 一般 ≤ 10）'}
];
function maxN(lg,B){const hi=1e9;if(lg(hi)<=B)return null;if(lg(1)>B)return 0;let lo=1,h=hi;while(h-lo>1){const m=Math.floor((lo+h)/2);if(lg(m)<=B)lo=m;else h=m;}return lo;}
function mod_cx(r){
 r.innerHTML=head('① 数据范围 → 能用的复杂度','数据范围不是装饰：它直接告诉你评测机能承受多少次运算。拖动 n，看哪些复杂度档次还能过。')+`
 ${note('hard','「O(n²) 到底能不能过」没有直觉。n=5000 和 n=10⁵ 只差 20 倍，运算量却差 400 倍。')}
 <p class="mute">互动方式：滑块改变 n 与评测条件，每个复杂度一根条（对数刻度），竖线是运算预算。条在竖线左侧为可行。'+TAG_CALC+'</p>
 <div class="doc">
 <div class="ctls">

  <label class="ctl"><span class="cl">机器速度（假设）</span><select id="cx-s"><option value="5e7">5×10⁷ 次/秒（保守）</option><option value="1e8" selected>1×10⁸ 次/秒（常用估算）</option><option value="3e8">3×10⁸ 次/秒（简单循环，乐观）</option></select></label>
  <label class="ctl"><span class="cl">每步的实际代价（假设）</span><select id="cx-c"><option value="1" selected>1 个基本运算（简单循环）</option><option value="3">约 3 倍（取模、数组随机访问）</option><option value="10">约 10 倍（STL set/map、线段树递归）</option><option value="30">约 30 倍（常数很大的做法）</option></select></label>
  <label class="ctl"><span class="cl">测试组数 T（假设每组都是此规模）</span><select id="cx-g"><option value="1" selected>1 组</option><option value="10">10 组</option><option value="100">100 组</option><option value="1000">1000 组</option></select></label>
 </div>

 </div>`;
 const presets=[[20,'n≈20'],[500,'n≈500'],[5000,'n≈5000'],[1e5,'n≈10⁵'],[1e6,'n≈10⁶'],[1e7,'n≈10⁷']];
 $('#cx-chips').innerHTML=presets.map(p=>`<button class="chip" data-v="${p[0]}">${p[1]}</button>`).join('');
 $('#cx-chips').onclick=e=>{const b=e.target.closest('button');if(!b)return;$('#cx-e').value=Math.log10(+b.dataset.v);upd();};
 function upd(){

   if(ok)best=i;

   <div class="meta">常见做法：${x.al}</div></div>`;
  });

 }
 r.addEventListener('input',upd);r.addEventListener('change',upd);upd();
 r.insertAdjacentHTML('beforeend',
  note('why','每个复杂度的运算量随 n 增长的速度不同：O(n²) 每把 n 放大 10 倍，运算量放大 100 倍；O(2ⁿ) 每把 n 加 1，运算量翻倍，所以 n 只能到 20 左右。把滑块从 n≈5000 拖到 10⁵，观察 O(n²) 的条越过竖线。')+
  note('lim','只比较运算次数的数量级，忽略常数。同一复杂度的两种做法，常数可差 10 倍以上（调「每步的实际代价」可看到影响）。若题目给「所有测试组的 n 之和 ≤ 某值」，应按总和而非每组计算。内存限制是另一个独立约束，见页面⑤。')+
  note('tip','读题顺序：先找 n、m、q、值域、T；再用本页反推；再结合题目结构（区间/树/图/序列）挑算法。同一档次有多种算法，只能缩小范围，不能直接确定。'));
}

function bars(rows){const mx=Math.max(1,...rows.map(x=>x.val));const L=v=>Math.log10(v+1)/Math.log10(mx+1)*100;
 return rows.map(x=>`<div class="brow"><div>${x.label}</div><div class="track"><div class="fill ${x.cls}" style="width:${clamp(L(x.val),2,100).toFixed(1)}%"></div></div><div class="bv">${fmt(x.val)} 次</div></div>`).join('');}
function mod_cmp(r){
 r.innerHTML=head('② 暴力 vs 优化：真实计数运算次数','对同一份数据，把暴力和优化后的做法都实际跑一遍，数一数各自做了多少次基本运算，并核对答案一致。')+`
 ${note('hard','「优化」到底省在哪？什么时候不划算？直觉不可靠，要看两边的运算次数。')}
 <div class="doc">
 <div class="seg" id="cmp-sc"><label><input type="radio" name="cmpsc" value="pre" checked>区间求和：前缀和</label><label><input type="radio" name="cmpsc" value="win">最短子数组：双指针</label><label><input type="radio" name="cmpsc" value="bin">查找：二分</label></div>
 <div class="ctls" id="cmp-par"></div>
 <button class="btn" id="cmp-seed">换一组示意数据</button>
 <div id="cmp-out"></div></div>`;
 const SC={
  pre:{par:()=>rng('p-n','数组长度 n',10,3000,10,1000,' 个')+rng('p-q','询问次数 q',1,3000,1,1000,' 次'),
   run(){const n=+$('#p-n').value,q=+$('#p-q').value,R=prng(SEED),a=[];for(let i=0;i<n;i++)a.push(1+Math.floor(R()*9));
    const s=[0];for(let i=0;i<n;i++)s.push(s[i]+a[i]);
    let brute=0,pre=n,same=true,len=0;
    for(let k=0;k<q;k++){let l=Math.floor(R()*n),h=Math.floor(R()*n);if(l>h){const t=l;l=h;h=t;}let t=0;for(let i=l;i<=h;i++){t+=a[i];brute++;}len+=h-l+1;pre++;if(t!==s[h+1]-s[l])same=false;}
    const peek='<p class="mute">前 10 项（'+TAG_DEMO+'）：</p><div class="scroll"><table><tr><th>下标</th>'+a.slice(0,10).map((_,i)=>`<td>${i+1}</td>`).join('')+'</tr><tr><th>a[i]</th>'+a.slice(0,10).map(x=>`<td>${x}</td>`).join('')+'</tr><tr><th>前缀和 s[i]</th>'+s.slice(1,11).map(x=>`<td>${x}</td>`).join('')+'</tr></table></div>';
    return{la:'暴力：每问把区间逐个相加',lb:'前缀和：建表 n 次 + 每问 1 次减法',na:brute,nb:pre,same,peek,
     why:`随机区间平均长约 ${(len/q).toFixed(0)}，暴力每问就要这么多次加法。前缀和把「重复累加」的成本提前一次付清（${fmt(n)} 次），之后每问 O(1)。把 q 拖到很小（比如 1–3），你会看到预处理反而吃亏：优化有「回本点」。`,
     lim:'假设：一次加法或减法算 1 次运算；数值 1–9 随机；区间随机。前提是数组在查询之间不修改；若有修改，改用树状数组或线段树。比较的是运算次数，不是真实耗时。'};}},
  win:{par:()=>rng('w-n','数组长度 n',10,3000,10,1000,' 个')+rng('w-p','目标和 S 占总和的比例',1,100,1,10,' %'),
   run(){const n=+$('#w-n').value,pct=+$('#w-p').value,R=prng(SEED),a=[];let tot=0;for(let i=0;i<n;i++){const x=1+Math.floor(R()*9);a.push(x);tot+=x;}
    const S=Math.max(1,Math.round(tot*pct/100));
    let best=Infinity,ops=0;
    for(let l=0;l<n;l++){let sum=0;for(let h=l;h<n;h++){sum+=a[h];ops++;if(sum>=S){best=Math.min(best,h-l+1);break;}}}
    let l=0,sum=0,b2=Infinity,o2=0;
    for(let h=0;h<n;h++){sum+=a[h];o2++;while(sum-a[l]>=S){sum-=a[l];l++;o2++;}if(sum>=S)b2=Math.min(b2,h-l+1);}
    return{la:'暴力：每个左端点向右累加到 ≥S 就停',lb:'双指针：l、r 只向右走',na:ops,nb:o2,same:best===b2,
     peek:`<p>${TAG_DEMO} 总和 = ${fmt(tot)}，S = ${fmt(S)}，最短满足区间长度 = <b>${best}</b>。</p>`,
     why:'暴力对每个 l 重新累加，S 越大每次累加越长，趋近 O(n²)。双指针利用「元素为正 → 窗口变大和只增不减」的单调性，l 和 r 各最多走 n 步，总计 ≤ 2n。把 S 的比例拖大，暴力的次数迅速上升而双指针几乎不变。',
     lim:'前提：所有元素为正数。含负数或零时窗口的和不再单调，双指针失效，需要前缀和 + 其他结构。数据为随机 1–9；这里的暴力已带「提前停止」，是较温和的暴力。'};}},
  bin:{par:()=>`<label class="ctl"><span class="cl">数组长度 n =<output id="b-n">1,000,000</output> 个（对数刻度）</span><input type="range" id="b-e" min="1" max="7" step="0.1" value="6"></label>`+rng('b-p','目标所在位置',0,100,1,70,' %')+`<label class="chk"><input type="checkbox" id="b-x"><span>目标不在数组中</span></label>`,
   run(){const n=Math.round(Math.pow(10,+$('#b-e').value));$('#b-n').textContent=fmt(n);const pct=+$('#b-p').value,absent=$('#b-x').checked;
    const pos=Math.floor(pct/100*(n-1)),t=absent?2*pos+2:2*pos+1;
    const lin=absent?n:pos+1;let lo=0,hi=n-1,st=0;
    while(lo<=hi){const mid=Math.floor((lo+hi)/2);st++;const v=2*mid+1;if(v===t)break;if(v<t)lo=mid+1;else hi=mid-1;}
    return{la:'线性扫描：从头比较',lb:'二分查找：每次丢掉一半',na:lin,nb:st,same:true,
     peek:`<p>${TAG_DEMO} 数组为 1,3,5,…（第 i 项 = 2i+1，已排序），查找 ${fmt(t)}。二分最多需要约 ⌈log₂(n+1)⌉ = <b>${Math.ceil(Math.log2(n+1))}</b> 次。</p>`,
     why:'每比较一次，剩余候选区间减半，所以次数约为 log₂n；n 从 10³ 涨到 10⁷，二分只从约 10 次涨到约 24 次，线性扫描却涨了一万倍。',
     lim:'前提：数组已排好序。排序本身要 O(n log n)：只查一次时直接线性扫描更省；要查很多次才值得先排序。一次三路比较（相等/小于/大于）记 1 次。'};}}
 };
 let cur='pre';
 function setSc(){cur=$('input[name=cmpsc]:checked').value;$('#cmp-par').innerHTML=SC[cur].par();show();}
 function show(){const o=SC[cur].run(),ratio=o.na/o.nb;

  <div class="kpi"><div><span>暴力 ÷ 优化（运算次数之比）</span><b>${ratio>=1?ratio.toFixed(1)+' 倍':'暴力更省（优化多 '+(1/ratio).toFixed(1)+' 倍）'}</b></div><div><span>答案核对</span><b class="${o.same?'ok':'bad'}">${o.same?'✓ 两种做法一致':'✗ 不一致'}</b></div></div>`+

 $('#cmp-seed').onclick=()=>{SEED+=1;show();};

function algoBS(){return{n:'二分答案：木材加工',
 hard:'「答案有单调性，所以能把求最优变成反复判断可不可行」。',
 par:()=>`<label class="ctl"><span class="cl">木头长度（整数 1–40，逗号分隔，至多 8 根）${TAG_DEMO}</span><input type="text" id="bs-l" value="10,24,15"></label>`+rng('bs-k','需要的段数 k',1,30,1,7,' 段'),
 build(){const L=parseInts($('#bs-l').value),k=+$('#bs-k').value;
  if(!L.length||L.length>8||L.some(x=>!Number.isInteger(x)||x<1||x>40))return[{err:'木头长度请输入 1–8 个 1 到 40 之间的整数，用逗号分隔。'}];
  const max=Math.max(...L),tot0=L.reduce((a,b)=>a+b,0);let lo=1,hi=max,ans=0;
  const F=[{max,lo,hi,ans,mid:null,text:`目标：把木头切成 ≥ ${k} 段<b>等长</b>木料，求最长的段长。段长一定在 1 到 ${max} 之间。每步取中点 mid，判断「每根切 ⌊长度/mid⌋ 段，总段数够不够」。`}];
  while(lo<=hi){const mid=(lo+hi)>>1,cnt=L.map(x=>Math.floor(x/mid)),tot=cnt.reduce((a,b)=>a+b,0),ok=tot>=k;
   F.push({max,lo,hi,ans,mid,text:`区间 [${lo}, ${hi}]，试 mid=${mid}：各根切 ${cnt.join('+')} = <b>${tot}</b> 段，${ok?'≥':'<'} ${k}。${ok?`<b class="ok">可行</b> → 记录 ans=${mid}，答案可能更长，令 lo=${mid+1}。`:`<b class="bad">不可行</b> → 段太长了，令 hi=${mid-1}。`}`});
   if(ok){ans=mid;lo=mid+1;}else hi=mid-1;}
  F.push({max,lo,hi,ans,mid:null,text:ans?`lo=${lo} > hi=${hi}，结束。最大可行段长 = <b>${ans}</b>。只判断了 ${F.length-1} 次，逐个试要 ${max} 次。`:`没有任何段长可行：连段长 1 也只能切出 ${tot0} 段，不到 ${k} 段，无解。`});
  return F;},
 view(f){let h='';for(let v=1;v<=f.max;v++){let c=(v<f.lo||v>f.hi)?'out':'in';if(v===f.mid)c='mid';if(v===f.ans)c+=' ans';h+=cell(v,c);}
  return `<div class="vars"><span>lo=${f.lo}</span><span>hi=${f.hi}</span><span>mid=${f.mid===null?'—':f.mid}</span><span>ans=${f.ans||'无'}</span></div><div>${h}</div><p class="mute">深蓝=mid，浅蓝=仍可能的区间，灰=已排除，绿框=当前记录的 ans。</p>`;},
 fine:'为什么能二分：段长越大，能切出的段数越少（单调）。边界：只有「可行性随答案单调变化」的题才能用二分答案；判断函数要能在 O(n) 左右完成。示意数据为手工例子。'};}
function algoKN(){return{n:'背包 DP：01 与完全',
 hard:'01 背包的容量为什么要倒序，完全背包为什么要正序。',
 par:()=>rng('kn-v','背包容量 V',1,15,1,5,' 单位')+`<label class="ctl"><span class="cl">物品「重量:价值」（至多 6 件）${TAG_DEMO}</span><input type="text" id="kn-i" value="2:3, 3:4, 4:5"></label><div class="seg"><label><input type="radio" name="knm" value="01" checked>01 背包（每件至多 1 次，容量倒序）</label><label><input type="radio" name="knm" value="full">完全背包（每件无限次，容量正序）</label></div>`,
 build(){const V=+$('#kn-v').value,mode=$('input[name=knm]:checked').value;
  const items=$('#kn-i').value.split(/[,，\s]+/).filter(Boolean).map(s=>s.split(':').map(Number));
  if(!items.length||items.length>6||items.some(p=>p.length!==2||!Number.isInteger(p[0])||!Number.isInteger(p[1])||p[0]<1||p[1]<1||p[0]>20||p[1]>99))return[{err:'请按「重量:价值」填写 1–6 件物品，例如 2:3, 3:4。重量 1–20，价值 1–99。'}];
  const run=m=>{let dp=Array(V+1).fill(0);const F=[{dp:dp.slice(),ch:[],text:`dp[j] 表示容量为 j 时的最大价值，初始全为 0。逐件处理物品。`}];
   items.forEach(([w,v],i)=>{const nd=dp.slice(),ch=[],det=[];const js=[];if(m==='01'){for(let j=V;j>=w;j--)js.push(j);}else{for(let j=w;j<=V;j++)js.push(j);}
    for(const j of js){const cand=nd[j-w]+v;if(cand>nd[j]){det.push(`dp[${j}]：${nd[j]}→${cand}（= dp[${j-w}]+${v}）`);ch.push(j);nd[j]=cand;}}
    dp=nd;F.push({dp:dp.slice(),ch,text:`物品 ${i+1}（重 ${w}，值 ${v}）：容量从${m==='01'?'大到小（保证 dp[j−w] 还是「没用过本物品」的旧值）':'小到大（dp[j−w] 可能已含本物品，所以本物品可重复用）'}扫描。${det.length?'变化：'+det.join('；')+'。':'没有格子变化。'}`});});
   return F;};
  const F=run(mode),other=run(mode==='01'?'full':'01'),a=F[F.length-1].dp[V],b=other[other.length-1].dp[V];
  F[F.length-1].text+=`<br><b>结果：dp[${V}] = ${a}。</b>（对照：换成${mode==='01'?'完全':'01'}背包，结果是 ${b}。）`;
  return F;},
 view(f){let h='';f.dp.forEach((x,j)=>{h+=cell(x,f.ch.includes(j)?'chg':'',j);});return `<div>${h}</div><p class="mute">格子上方为 dp 值，下标 j 是容量；黄色=本步被更新。</p>`;},

function algoDQ(){return{n:'单调队列：滑动窗口最大值',

 build(){const A=parseInts($('#dq-a').value);let k=+$('#dq-k').value;

function algoPW(){return{n:'快速幂：反复平方',

 build(){const a=clamp(Math.floor(+$('#pw-a').value)||1,1,1000),b=clamp(Math.floor(+$('#pw-b').value)||1,1,1e9),p=BigInt($('#pw-p').value);
  const bits=b.toString(2),L=bits.length;let r=1n,base=BigInt(a)%p,bb=BigInt(b);
  const parts=[];for(let t=0;t<L;t++)if(bits[L-1-t]==='1')parts.push(`${a}^${2**t}`);
  const F=[{bits,t:-1,r:r.toString(),base:base.toString(),text:`${a}^${b}：把 b=${b} 写成二进制 ${bits}，得 ${a}^${b} = ${parts.join(' × ')}。从最低位开始：bit=1 就乘进结果，每步 base 自乘（平方）。`}];
  for(let t=0;t<L;t++){const bit=bits[L-1-t];let s=`第 ${t} 位（权重 2^${t}）= <b>${bit}</b>：`;
   if(bit==='1'){const nr=r*base%p;s+=`r = r × base mod p = ${r}×${base} mod ${p} = ${nr}；`;r=nr;}else s+='这一位是 0，r 不变；';
   const nb=base*base%p;s+=`然后 base = base² mod p = ${base}² mod ${p} = ${nb}。`;base=nb;

function algoSV(){return{n:'筛法：埃氏筛 vs 线性筛',

 build(){const N=+$('#sv-n').value,mode=$('input[name=svm]:checked').value,S=sieveStats(N);

function algoSO(){return{n:'排序：冒泡、选择、插入',

 bind(rb){const b=$('#so-seed');if(b)b.onclick=()=>{SEED++;rb();};},
 build(){const n=+$('#so-n').value,algo=$('input[name=soa]:checked').value,R=prng(SEED),a=[];

function algoBF(){return{n:'BFS：网格迷宫最短路',

 build(){const N=8,dist=Array(64).fill(-1),par=Array(64).fill(-1),q=[0];dist[0]=0;const D=[[0,1,'右'],[1,0,'下'],[0,-1,'左'],[-1,0,'上']];

function mod_bit(r){
 let w=8,u=BigInt.asUintN(8,-5n);
 r.innerHTML=head('④ 进制、补码与 ASCII','第一轮笔试常考。点击二进制位（0/1）切换，下面立刻显示同一串位在不同解读下的值。')+`
 ${note('hard','同一串二进制位，按「无符号」和「有符号补码」读，数值不同；超出范围会「回绕」。')}
 <div class="doc"><div class="seg" id="bt-w"><label><input type="radio" name="btw" value="8" checked>8 位</label><label><input type="radio" name="btw" value="16">16 位</label><label><input type="radio" name="btw" value="32">32 位（相当于 int）</label></div>
 <label class="ctl"><span class="cl">也可以直接输入十进制整数（可超出范围，观察回绕）</span><input type="text" id="bt-d" inputmode="numeric" value="-5"></label>
 <p class="mute">点击下面的位切换 0/1，红框是符号位（最高位），小字是位权 2^i。</p><div id="bt-bits"></div><div id="bt-out"></div></div>
 <h2>ASCII 与字符</h2><div class="doc"><label class="ctl"><span class="cl">输入一个字符</span><input type="text" id="as-c" maxlength="2" value="a"></label><div id="as-out"></div></div>`;
 function draw(){
  let h='';for(let i=w-1;i>=0;i--){const b=(u>>BigInt(i))&1n;h+=`<button class="bit ${b?'one':''} ${i===w-1?'sign':''}" data-i="${i}" aria-label="第 ${i} 位，当前 ${b}，点击切换">${b}<small>${i}</small></button>`;if(i&&i%8===0)h+='<br>';else if(i&&i%4===0)h+='<span class="gap"></span>';}
  $('#bt-bits').innerHTML=h;
  const s=BigInt.asIntN(w,u),bin=u.toString(2).padStart(w,'0'),M=1n<<BigInt(w);let ex='';
  if(s<0n){const m=-s;if(m>=M/2n)ex=`这是 ${w} 位补码的最小值 −2^${w-1}：其绝对值放不进 ${w-1} 位，没有原码；对它取负仍得到它自己（溢出）。`;
   else{const mag=m.toString(2).padStart(w-1,'0'),yuan='1'+mag,fan='1'+mag.split('').map(c=>c==='1'?'0':'1').join(''),bu=(BigInt('0b'+fan)+1n).toString(2).padStart(w,'0');
    ex=`<div class="scroll"><table><tr><th>步骤</th><th>二进制</th></tr><tr><td>原码：符号位 1 + 绝对值 ${m}</td><td class="mono">${yuan}</td></tr><tr><td>反码：符号位不变，其余位取反</td><td class="mono">${fan}</td></tr><tr><td>补码：反码 + 1</td><td class="mono">${bu} ${bu===bin?'= 当前位串 ✓':''}</td></tr></table></div>`;}}
  else ex='非负数：原码、反码、补码相同。';
  $('#bt-out').innerHTML=`<div class="kpi"><div><span>按无符号读</span><b>${u}</b></div><div><span>按有符号补码读</span><b>${s}</b></div><div><span>十六进制</span><b>0x${u.toString(16).toUpperCase().padStart(w/4,'0')}</b></div><div><span>八进制</span><b>0${u.toString(8)}</b></div></div>
  <p>${ex}</p>`+note('why','补码让加减法共用同一套电路：−5 的补码 + 5 的补码 = 全 0（进位丢掉）。负数的补码 = 2^w − |值|，所以位串相同、读法不同，值相差 2^w。')+
  note('lim',`${w} 位有符号数范围是 −2^${w-1} 到 2^${w-1}−1，即 ${-(M/2n)} 到 ${M/2n-1n}；无符号为 0 到 ${M-1n}。C++ 中有符号整数溢出在标准里是「未定义行为」，下方的「回绕」只是常见机器上的表现，比赛中应当避免，而不是依赖。`);
 }
 function ascii(){const v=$('#as-c').value;if(!v){$('#as-out').innerHTML='';return;}const ch=[...v][0],cp=ch.codePointAt(0);let ex='';

 $('#bt-w').addEventListener('change',()=>{w=+$('input[name=btw]:checked').value;u=BigInt.asUintN(w,u);$('#bt-d').value=BigInt.asIntN(w,u).toString();draw();});

 $('#as-c').addEventListener('input',ascii);
 draw();ascii();
}

 <div id="tr-out"></div></div>
 ${note('why','遍历只是「根相对于左右子树的访问时机」不同。前序的第一个一定是根；在中序中找到根，左边就是左子树、右边是右子树，递归地还原——这就是还原的全过程。若只有前序+后序，当某结点只有一个孩子时，无法判断它是左孩子还是右孩子（例如前序 AB、后序 BA：B 可以是 A 的左孩子也可以是右孩子），所以不唯一。')}
 <h2>堆/完全二叉树的下标计算器</h2><div class="doc"><div class="ctls">${rng('hp-n','结点总数 n',1,63,1,10,' 个')}${rng('hp-i','结点编号 i',1,63,1,5,'')}</div><div id="hp-out"></div></div>
 <h2>表达式：中缀 → 后缀（栈）</h2><div class="doc">${note('hard','后缀表达式不需要括号；中缀转后缀靠「运算符栈」。后缀式就是表达式树的后序遍历。')}
 <label class="ctl"><span class="cl">中缀表达式（整数、+ − × ÷ 用 + - * /、括号）${TAG_DEMO}</span><input type="text" id="ex-s" value="3+2*4-(6-2)/2"></label><div id="ex-out"></div></div>`;
 let seq=[],tr=null;
 function layout(root){const nodes=[];let xi=0,maxd=0;(function f(t,d){if(!t)return;f(t.l,d+1);t.x=xi++;t.d=d;maxd=Math.max(maxd,d);nodes.push(t);f(t.r,d+1);})(root,0);return{nodes,n:xi,maxd};}
 function trav(m){const o=[];if(m==='lv'){const q=[tr];while(q.length){const t=q.shift();o.push(t);if(t.l)q.push(t.l);if(t.r)q.push(t.r);}return o;}
  (function f(t){if(!t)return;if(m==='pre')o.push(t);f(t.l);if(m==='in')o.push(t);f(t.r);if(m==='post')o.push(t);})(tr);return o;}
 function parse(){const p=$('#tr-p').value.trim().toUpperCase(),i=$('#tr-i').value.trim().toUpperCase();
  const ok=p.length>=1&&p.length<=10&&p.length===i.length&&new Set(p).size===p.length&&[...p].sort().join('')===[...i].sort().join('')&&/^[A-Z]+$/.test(p);
  if(!ok){tr=null;$('#tr-out').innerHTML='<p class="err">请输入长度相同、各不重复的大写字母（至多 10 个），且前序与中序包含同样的字母。</p>';return;}
  try{tr=buildTree([...p],[...i]);}catch(e){tr=null;$('#tr-out').innerHTML='<p class="err">前序与中序不匹配，无法还原。</p>';return;}
  $('#tr-s').max=p.length;if(+$('#tr-s').value>p.length){$('#tr-s').value=p.length;$('#tr-s-o').textContent=p.length;}draw();}
 function draw(){if(!tr)return;const m=$('input[name=trm]:checked').value,s=+$('#tr-s').value,L=layout(tr),order=trav(m),vis=new Set(order.slice(0,s)),nowN=s>0?order[s-1]:null;
  const W=L.n*46+20,H=(L.maxd+1)*62+20;let svg=`<svg class="tree" viewBox="0 0 ${W} ${H}" width="${Math.min(W,640)}" role="img" aria-label="二叉树">`;
  L.nodes.forEach(t=>{[t.l,t.r].forEach(c=>{if(c)svg+=`<line x1="${t.x*46+33}" y1="${t.d*62+30}" x2="${c.x*46+33}" y2="${c.d*62+30}"/>`;});});
  L.nodes.forEach(t=>{const cl=t===nowN?'now':vis.has(t)?'vis':'';const idx=order.indexOf(t)+1;
   svg+=`<circle class="${cl}" cx="${t.x*46+33}" cy="${t.d*62+30}" r="16"/><text class="${cl==='now'?'now':''}" x="${t.x*46+33}" y="${t.d*62+30}">${t.c}</text>${vis.has(t)?`<text class="ord" x="${t.x*46+33}" y="${t.d*62+52}">${idx}</text>`:''}`;});
  svg+='</svg>';
  const names={pre:'前序',in:'中序',post:'后序',lv:'层序'};
  const all=['pre','in','post','lv'].map(k=>`<tr><td>${names[k]}</td><td class="mono">${trav(k).map(t=>t.c).join(' ')}</td></tr>`).join('');
  $('#tr-out').innerHTML=svg+`<p>${names[m]}已访问：<b class="mono">${order.slice(0,s).map(t=>t.c).join(' ')||'（尚未开始）'}</b>${s>0?`　最新访问：<b>${nowN.c}</b>`:''}</p><div class="scroll"><table><tr><th>遍历</th><th>结果</th></tr>${all}</table></div>`;}
 function hp(){const n=+$('#hp-n').value,i=Math.min(+$('#hp-i').value,n),lc=2*i,rc=2*i+1;
  $('#hp-out').innerHTML=`<table><tr><td>结点 ${i} 的父结点</td><td class="mono">${i===1?'无（是根）':'⌊i/2⌋ = '+(i>>1)}</td></tr><tr><td>左孩子 2i</td><td class="mono">${lc} ${lc<=n?'':'（> n，不存在）'}</td></tr><tr><td>右孩子 2i+1</td><td class="mono">${rc} ${rc<=n?'':'（> n，不存在）'}</td></tr><tr><td>所在层（根为第 1 层）</td><td class="mono">⌊log₂ i⌋+1 = ${Math.floor(Math.log2(i))+1}</td></tr><tr><td>第 k 层最多结点数</td><td class="mono">2^(k−1)，第 ${Math.floor(Math.log2(i))+1} 层最多 ${2**Math.floor(Math.log2(i))} 个</td></tr></table><p class="mute">假设：结点按「完全二叉树」从 1 开始逐层从左到右编号（二叉堆的数组存法）。若 i 大于 n，已按 n 截断。</p>`;}
 function ex(){const s=$('#ex-s').value.replace(/\s+/g,'');if(!s){$('#ex-out').innerHTML='';return;}
  const toks=s.match(/\d+|[-+*/()]/g)||[];
  if(toks.join('')!==s){$('#ex-out').innerHTML='<p class="err">含有不支持的字符：只支持整数、+ - * / 和括号。</p>';return;}
  const pr={'+':1,'-':1,'*':2,'/':2},out=[],st=[],tb=[];
  try{for(const t of toks){if(/\d/.test(t))out.push(t);else if(t==='(')st.push(t);else if(t===')'){while(st.length&&st[st.length-1]!=='(')out.push(st.pop());if(!st.length)throw new Error('括号不匹配：多了 )');st.pop();}
    else{while(st.length&&st[st.length-1]!=='('&&pr[st[st.length-1]]>=pr[t])out.push(st.pop());st.push(t);}
    tb.push([t,st.join(' ')||'（空）',out.join(' ')||'（空）']);}
   while(st.length){const t=st.pop();if(t==='(')throw new Error('括号不匹配：多了 (');out.push(t);}
   const v=[];for(const t of out){if(/\d/.test(t))v.push(+t);else{const b=v.pop(),a=v.pop();if(a===undefined||b===undefined)throw new Error('表达式不完整（本页不支持开头的负号）');if(t==='/'&&b===0)throw new Error('除数为 0');v.push(t==='+'?a+b:t==='-'?a-b:t==='*'?a*b:a/b);}}
   if(v.length!==1)throw new Error('表达式不完整');
   $('#ex-out').innerHTML=`<div class="scroll"><table><tr><th>读到</th><th>运算符栈</th><th>输出</th></tr>${tb.map(x=>`<tr><td class="mono">${esc(x[0])}</td><td class="mono">${esc(x[1])}</td><td class="mono">${esc(x[2])}</td></tr>`).join('')}</table></div><p>后缀表达式：<b class="mono">${out.join(' ')}</b>　值 = <b>${Number.isInteger(v[0])?v[0]:v[0].toFixed(4)}</b></p>`+
    note('why','读到数字直接输出；读到运算符时，先把栈里优先级不低于它的运算符弹出输出，再入栈；右括号则弹到左括号为止。后缀式求值只需一个数栈，遇到运算符就弹出两个数计算。')+
    note('lim','这里的除法是实数除法；C++ 中整数除法向零取整，结果可能不同。不支持一元负号和小数。')}
  catch(e){$('#ex-out').innerHTML=`<p class="err">${esc(e.message)}</p>`;}}
 $('#tr-p').addEventListener('input',()=>{$('#tr-s').value=0;$('#tr-s-o').textContent=0;parse();});
 $('#tr-i').addEventListener('input',()=>{$('#tr-s').value=0;$('#tr-s-o').textContent=0;parse();});
 $('#tr-m').addEventListener('change',draw);$('#tr-s').addEventListener('input',draw);
 $('#hp-n').addEventListener('input',hp);$('#hp-i').addEventListener('input',hp);$('#ex-s').addEventListener('input',ex);
 parse();hp();ex();
}

function mod_mat(r){
 r.innerHTML=head('⑦ 计数与博弈','这些题靠「推导结论」而不是「优化」。每个结论都配了暴力验证，让你相信公式不是凭空来的。')+`
 <h2>容斥原理</h2><div class="doc">${note('hard','为什么「减去单个、加回两两、减去三三……」，以及为什么是用最小公倍数。')}
 <p>问题：1 到 N 中，有多少个数<b>不能被</b>所选数字中的任何一个整除？</p>
 <div class="ctls">${rng('ie-n','N',10,1000,10,100,'')}<div><span class="cl">选择除数（至多 5 个）</span><div class="seg" id="ie-d">${[2,3,4,5,6,7].map(x=>`<label><input type="checkbox" class="ie" value="${x}"${[2,3,5].includes(x)?' checked':''}>${x}</label>`).join('')}</div></div></div><div id="ie-out"></div></div>
 <h2>插板法</h2><div class="doc">${note('hard','「把相同的球放进不同的盒子」为什么等于组合数。')}
 <div class="ctls">${rng('sb-k','球数 k（相同的球）',1,12,1,10,' 个')}${rng('sb-m','盒子数 m（不同的盒子）',1,5,1,3,' 个')}</div>
 <label class="chk"><input type="checkbox" id="sb-e" checked><span>允许有空盒子</span></label><div id="sb-out"></div></div>
 <h2>取石子博弈与 Nim</h2><div class="doc">${note('hard','「必败态」是怎么递推出来的，为什么多堆用异或。')}
 <div class="ctls">${rng('gm-m','每次最多取 m 个',1,6,1,3,' 个')}${rng('gm-n','石子总数 n',1,40,1,20,' 个')}</div><div id="gm-out"></div>
 <h3>Nim（多堆，每次从一堆里取任意个，取走最后一个者胜）</h3>
 <label class="ctl"><span class="cl">各堆石子数（2–6 堆，每堆 0–99）${TAG_DEMO}</span><input type="text" id="nm-h" value="3,4,5"></label><div id="nm-out"></div></div>`;
 function C(n,k){if(k<0||k>n)return 0;let x=1;for(let i=1;i<=k;i++)x=x*(n-k+i)/i;return Math.round(x);}
 function ie(){const N=+$('#ie-n').value;let ds=$$('.ie:checked').map(x=>+x.value);
  if(ds.length>5){ds=ds.slice(0,5);}if(!ds.length){$('#ie-out').innerHTML='<p class="err">请至少选择一个除数。</p>';return;}
  let tot=N,rows='';for(let m=1;m<(1<<ds.length);m++){let l=1,sz=0,nm=[];for(let i=0;i<ds.length;i++)if(m>>i&1){l=lcm(l,ds[i]);sz++;nm.push(ds[i]);}
   const sg=sz%2?-1:1,c=Math.floor(N/l);tot+=sg*c;rows+=`<tr><td class="mono">{${nm.join(',')}}</td><td class="mono">${l}</td><td>${sg>0?'+':'−'}</td><td class="mono">⌊${N}/${l}⌋ = ${c}</td><td class="mono">${sg*c}</td></tr>`;}
  let br=0;for(let x=1;x<=N;x++)if(ds.every(d=>x%d))br++;
  $('#ie-out').innerHTML=`<div class="kpi"><div><span>容斥公式</span><b>${tot}</b></div><div><span>逐个检查（暴力）</span><b>${br}</b></div><div><span>是否一致</span><b class="${tot===br?'ok':'bad'}">${tot===br?'✓ 一致':'✗'}</b></div></div>
  <details class="fold" open><summary>展开每一项（N + Σ ± ⌊N/lcm⌋）</summary><div class="scroll"><table><tr><th>子集</th><th>最小公倍数</th><th>符号</th><th>被整除的个数</th><th>贡献</th></tr>${rows}</table></div></details>`+
  note('why','先把「被任一个整除」的数减掉，被两个同时整除的数被减了两次，要加回一次；被三个同时整除的又被加回过头，再减……符号 (−1)^|子集| 正是为了每个数最终恰好被统计一次。同时被几个数整除，等价于被它们的最小公倍数整除，所以用 lcm（如 4 和 6 的 lcm 是 12，不是 24）。')+
  note('lim','选择个数最多 5 个（子集 2⁵−1=31 项）；公式适合「条件个数少」的场景，条件很多时项数指数增长。这里的 N 是 10–1000，仅为演示。');}
 function sb(){const k=+$('#sb-k').value,m=+$('#sb-m').value,em=$('#sb-e').checked;
  const f=em?C(k+m-1,m-1):C(k-1,m-1);
  const lo=em?0:1;const list=[];(function g(rem,left,cur){if(left===1){if(rem>=lo)list.push(cur.concat(rem));return;}for(let x=lo;x<=rem;x++)g(rem-x,left-1,cur.concat(x));})(k,m,[]);
  $('#sb-out').innerHTML=`<div class="kpi"><div><span>公式</span><b>${em?`C(${k+m-1}, ${m-1})`:`C(${k-1}, ${m-1})`} = ${f}</b></div><div><span>暴力枚举个数</span><b>${list.length}</b></div><div><span>是否一致</span><b class="${f===list.length?'ok':'bad'}">${f===list.length?'✓ 一致':'✗'}</b></div></div>`+
  (list.length<=15?`<p>全部方案（各盒球数）：${list.map(a=>`<span class="mono">(${a.join(',')})</span>`).join(' ')}</p>`:'<p class="mute">方案太多，不逐个列出（≤15 种时才列出）。</p>')+
  note('why',em?`允许空盒：把 ${k} 个球和 ${m-1} 块隔板排成一排，共 ${k+m-1} 个位置，选出 ${m-1} 个位置放隔板，方案数 C(${k+m-1}, ${m-1})。`:`每个盒子至少 1 个：先每盒放 1 个，剩下 ${k-m<0?'（球不够）':k-m} 个自由分配；等价于在 ${k} 个球形成的 ${k-1} 个空隙里选 ${m-1} 个放隔板，C(${k-1}, ${m-1})。`)+
  note('lim','球相同、盒子不同才适用此公式；球不同或盒子相同是另一类问题（后者涉及整数拆分/斯特林数）。k<m 且要求非空时方案数为 0。');}
 function gm(){const m=+$('#gm-m').value,n=+$('#gm-n').value,win=[false];for(let i=1;i<=n;i++){let w=false;for(let t=1;t<=Math.min(m,i);t++)if(!win[i-t])w=true;win.push(w);}
  let h='';win.forEach((w,i)=>{h+=cell(w?'胜':'败',w?'win':'lose',i);});
  const mod=n%(m+1);
  $('#gm-out').innerHTML=`<p class="mute">下标=剩余石子数；「胜」=轮到的人必胜，「败」=轮到的人必败（假设双方都最优，取走最后一个者胜）。</p><div>${h}</div><p>n=${n}：${win[n]?`先手必胜，第一步取 <b>${mod}</b> 个，把对手留在 ${n-mod}（${m+1} 的倍数）。`:`<b class="bad">先手必败</b>（n 是 ${m+1} 的倍数）。`}</p>`+
  note('why','0 个石子时轮到的人输（对手刚取完最后一个）。若某状态能一步走到「必败态」，它就是必胜态；若所有走法都走到必胜态，它就是必败态。从小到大递推，必败态恰好是 (m+1) 的倍数：无论你取 1…m 个，对手都能补成 m+1，把你永远留在倍数上。')+
  note('lim','只对「每次取 1..m 个、取走最后一个者胜」的规则成立；若规则改成「取走最后一个者负」或每次可取的个数不连续，结论要重新推导。');}
 function nm(){const h=parseInts($('#nm-h').value);if(h.length<2||h.length>6||h.some(x=>!Number.isInteger(x)||x<0||x>99)){$('#nm-out').innerHTML='<p class="err">请输入 2–6 个 0 到 99 之间的整数。</p>';return;}
  const X=h.reduce((a,b)=>a^b,0);let mv='';
  if(X!==0){for(let i=0;i<h.length;i++){const t=h[i]^X;if(t<h[i]){mv=`先手必胜：从第 ${i+1} 堆（${h[i]} 个）取走 ${h[i]-t} 个，剩 ${t} 个，使异或和变成 0。`;break;}}}
  $('#nm-out').innerHTML=`<p>异或和 = ${h.join(' ⊕ ')} = <b class="mono">${X}</b>（二进制 ${X.toString(2)}）。${X===0?'<b class="bad">异或和为 0 → 先手必败</b>。':mv}</p>`+
  note('why','异或和为 0 的局面，任取一堆的某些个都会使异或和变成非 0；异或和非 0 的局面，总能找到一堆把异或和调回 0。终局（全 0）异或和为 0，所以异或和为 0 就是必败态。')+
  note('lim','只适用于标准 Nim（每次只动一堆、数量任意、取走最后一个者胜）。其他变体需要转换成 SG 函数分析（超出 CSP-S 常规范围，了解即可）。');}
 $('#ie-n').addEventListener('input',ie);$('#ie-d').addEventListener('change',()=>{if($$('.ie:checked').length>5){const last=$$('.ie:checked').pop();last.checked=false;}ie();});
 ['sb-k','sb-m','sb-e'].forEach(i=>$('#'+i).addEventListener('input',sb));['gm-m','gm-n'].forEach(i=>$('#'+i).addEventListener('input',gm));$('#nm-h').addEventListener('input',nm);
 ie();sb();gm();nm();
}
